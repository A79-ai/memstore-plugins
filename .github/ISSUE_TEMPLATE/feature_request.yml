name: Feature request
description: Something the plugin should do
labels: [enhancement]
body:
  - type: textarea
    id: want
    attributes:
      label: What you'd like
      description: What you're trying to do, and what would help.
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: What you do today
      description: How you work around it now, if you do.
